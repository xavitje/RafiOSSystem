# RafiTune – instellingen
#
# Na een wijziging:  rafitune test-config          (controleren)
#                    sudo systemctl restart rafitune
# Zien wat RafiTune herkent: sudo rafitune scan
# Zien wat RafiTune nu doet: rafitune status
#
# Dit bestand blijft bewaard bij RafiOS-updates.

[algemeen]
# Seconden tussen twee controles (0.1 - 60). Lager = sneller reageren.
interval = 2

# Wat RafiTune standaard doet zodra er een game draait:
prioriteit = -5          # voorrang voor de game: -20 (hoogst) tot 0 (normaal)
cpu_performance = ja     # CPU op volle snelheid
afremmen = ja            # achtergrondtaken laagste voorrang geven

# Automatisch herkennen
herken_steam = ja        # elk Steam-spel (via SteamAppId)
herken_exe = ja          # elk Windows-programma (.exe) dat niet hieronder genegeerd wordt

# Mag RafiTune /proc/<pid>/environ lezen? Nodig voor herken_steam en appid:-regels.
# Zet op nee als een anti-cheat (bijv. Fortnite met EAC Linux v2) hier last van heeft.
lees_omgeving = ja

# Achtergrondtaken die tijdens een game worden afgeremd (procesnamen, zoals in top).
# Laat weg voor de standaardlijst: baloo, tracker, packagekit, rpm-ostree, flatpak, ...
# afremmen_processen = baloo_file, tracker-miner-fs-3, packagekitd

# Extra .exe-bestanden die GEEN game zijn (komt bovenop de ingebouwde lijst
# met launchers en Wine-onderdelen).
# negeer_exe = mijnlauncher.exe, updater.exe


# Profielen per game. Herkennen kan op vier manieren:
#   herken = appid:730             Steam-spel (nummer staat in de URL op store.steampowered.com)
#   herken = naam:cs2              procesnaam
#   herken = exe:witcher3.exe      Windows-programma
#   herken = cmdline:net.minecraft tekst in de opdrachtregel
# Per game kun je prioriteit, cpu_performance en afremmen anders instellen.

[game Counter-Strike 2]
herken = appid:730
prioriteit = -10

[game Minecraft]
herken = cmdline:net.minecraft.client

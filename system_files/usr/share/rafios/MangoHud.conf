# RafiOS – standaard MangoHud-overlay
# Wordt /etc/MangoHud.conf als de basis er zelf geen heeft.
# Eigen instellingen? Kopieer naar ~/.config/MangoHud/MangoHud.conf en pas aan;
# dat bestand gaat voor.
#
# Aan/uit tijdens het spelen: rechter-Shift + F12

### Wat je ziet
fps
frametime
frame_timing
cpu_stats
cpu_temp
gpu_stats
gpu_temp
ram
vram

### Uiterlijk
position=top-left
font_size=20
background_alpha=0.4
round_corners=8
text_color=FFFFFF
gpu_color=4EA1FF
cpu_color=4EA1FF
frametime_color=4EA1FF

### Toetsen
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

### Logbestanden (voor rafi-bench en handmatig loggen met linker-Shift + F2)
output_folder=/tmp/rafios-mangohud
